[project]
name = "nazbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.8",
    "aiohttp>=3.13.0",
    "aiosqlite>=0.21.0",
    "dateparser>=1.2.2",
    "discord-py==2.5.2",
    "fastapi>=0.135.3",
    "pydantic>=2.12.2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "tortoise-orm>=0.25.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.13",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# Aerich CLI: pass `--app models` (dazebot.db, default) or `--app returns`
# (returns.db) — `aerich --app <app> migrate` writes to migrations/<app>/.
# Both apps' migration history is tracked in ONE `aerich` table inside
# dazebot.db (the default connection); each app's *schema* still lands in
# its own DB file. Don't add `aerich.models` to the returns app's models
# list to "fix" this — it's the intended behaviour.
[tool.aerich]
tortoise_orm = "orm.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
